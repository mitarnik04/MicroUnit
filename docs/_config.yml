# GitHub Pages builds these docs with Jekyll (no theme: docs/_layouts/default.html is the layout).
title: MicroUnit
tagline: the PHP testing framework with zero dependencies
description: Fast, dependency-free PHP testing. Readable closures, real assertions, a Test Explorer, coverage without extensions, parallel runs, and output made for AI agents.
version: "1.0"
url: https://mitarnik04.github.io
baseurl: /MicroUnit
repository_url: https://github.com/mitarnik04/MicroUnit

permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope: { path: "" }
    values: { layout: default }

plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
