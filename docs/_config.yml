# GitHub Pages builds these docs with Jekyll (no theme: docs/_layouts/default.html is the layout).
title: MicroUnit
tagline: the dependency-free testing framework for PHP
description: A new way to test PHP. Built for today. The dependency-free testing framework, with tests you can read at a glance and fast runs.
version: "1.0"
url: https://mitarnik04.github.io
baseurl: /MicroUnit
repository_url: https://github.com/mitarnik04/MicroUnit

permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope: { path: "" }
    values: { layout: default }

plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
