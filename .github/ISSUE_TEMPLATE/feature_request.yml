name: Feature request
description: Suggest something MicroUnit should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could look
      description: |
        MicroUnit's tests should read top to bottom like a description of behaviour. A short test using
        the feature you have in mind is the best way to show it.
      render: php
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other tools solve it.
